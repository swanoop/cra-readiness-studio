name: Import independent CRA Readiness Studio source
on:
  push:
    branches: [main]
    paths: ['.publication/source.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify source archive
        run: |
          echo "315b3b95fdd163990c2198b9375791e22550e2791e562e80f9f5760dc654a534  .publication/source.zip" | sha256sum --check
          unzip -t .publication/source.zip | tail -2
      - name: Expand application and publish source
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          unzip -q .publication/source.zip -d "$tmp"
          cp -a "$tmp"/. .
          rm -rf .publication
          rm -f .github/workflows/bootstrap-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish CRA Readiness Studio v0.9.0-beta source"
          git push origin HEAD:main
