name: Verify CRA Readiness Studio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check src/app.js
      - run: node --check src/data.js
      - run: node --check src/engine.js
      - run: node --check src/store.js
      - run: node --check src/sbom.js
