name: Verify CRA Assurance Workbench
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free unit tests
        run: npm test
      - name: Syntax-check JS
        run: |
          find src tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate required static assets
        run: test -s index.html && test -s assets/styles.css && test -s src/app.js && test -s src/pages.js
  browser-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: npm install --no-audit --no-fund
      - name: Install supported browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser regression suite
        run: npm run test:browser
      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
