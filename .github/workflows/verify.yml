name: Verify CRA Assurance Workbench
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test all application modules
        run: npm test
      - name: Syntax-check every JS source and test file
        run: |
          for f in src/*.js tests/*.test.js; do
            node --check "$f"
          done
      - name: Verify HTML and core assets exist
        run: test -s index.html && test -s assets/styles.css && test -s src/app.js
